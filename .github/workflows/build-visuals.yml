# Rebuilds the README graphics whenever a project's results or config change, and commits them.
name: Build README visuals
on:
  push:
    paths: ["projects/*/results/**", "projects/*/tools/**", "projects/*/models/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build every project
        run: for t in projects/*/tools/build_readme_visuals.py; do python "$t"; done
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A projects assets docs
          git diff --cached --quiet || git commit -m "Rebuild README visuals"
          git push
